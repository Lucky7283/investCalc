<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Investment Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Investment Details</h3>
                </div>
                <div class="card-body" th:if="${investment}">
                    <div class="mb-4">
                        <p class="text-muted mb-1">Current Name</p>
                        <h4 th:text="${investment.name}">Name</h4>
                    </div>
                    <div class="mb-4">
                        <p class="text-muted mb-1">Amount Invested</p>
                        <h4 th:text="${#numbers.formatCurrency(investment.amount)}">$0</h4>
                    </div>
                    <div class="mb-4">
                        <p class="text-muted mb-1">Date Created</p>
                        <h4 th:text="${#temporals.format(investment.createdAt, 'dd-MM-yyyy HH:mm')}">Date</h4>
                    </div>

                    <hr>

                    <h5 class="mb-3">Update Investment Name</h5>
                    <form th:action="@{/investments/{id}/update-name(id=${investment.id})}" method="post">
                        <div class="input-group">
                            <input type="text" name="newName" class="form-control" th:value="${investment.name}" required>
                            <button class="btn btn-warning" type="submit">Update Name</button>
                        </div>
                    </form>

                    <div class="mt-4 d-flex justify-content-between">
                        <a href="/" class="btn btn-secondary">Back to Dashboard</a>
                        <form th:action="@{/investments/{id}/delete(id=${investment.id})}" method="post" onsubmit="return confirm('You sure that want to delete?')">
                            <button type="submit" class="btn btn-danger">Delete Investment</button>
                        </form>
                    </div>
                </div>
                <div class="card-body text-center" th:unless="${investment}">
                    <p>Investment not found.</p>
                    <a href="/" class="btn btn-secondary">Back to Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
