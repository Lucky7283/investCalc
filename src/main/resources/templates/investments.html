<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Investments</title>
    <link rel="stylesheet" th:href="@{/css/investments.css}">
</head>
<body>
<h1>All Investments</h1>
<div style="margin-bottom: 20px;">
    <a href="/funds/new" class="btn-new">Add New Investment</a>
    <form action="/funds" method="get" style="display: inline-block; margin-left: 20px;">
        <label for="sort">Sort by:</label>
        <select name="sort" id="sort" onchange="this.form.submit()" style="padding: 5px; border-radius: 4px;">
            <option value="date" th:selected="${param.sort == null or param.sort[0] == 'date'}">Latest First</option>
            <option value="name" th:selected="${param.sort != null and param.sort[0] == 'name'}">Alphabetical</option>
            <option value="amountAsc" th:selected="${param.sort != null and param.sort[0] == 'amountAsc'}">Amount Asc</option>
            <option value="amountDesc" th:selected="${param.sort != null and param.sort[0] == 'amountDesc'}">Amount Desc</option>
        </select>
    </form>
</div>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Amount</th>
        <th>Created At</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="fund : ${funds}">
        <td th:text="${fund.id}"></td>
        <td th:text="${fund.name}"></td>
        <td th:text="${fund.amount}"></td>
        <td th:text="${#temporals.format(fund.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
        <td class="actions">
            <a th:href="@{/funds/{id}(id=${fund.id})}">View</a>
        </td>
    </tr>
    </tbody>
</table>
<br>
<a href="/home">Back to Home</a>
</body>
</html>
