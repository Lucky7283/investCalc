<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Investment Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h1 class="mb-4 text-center">My Spring Portfolio</h1>

    <div class="row mb-4">
        <div class="col-md-6">
            <div class="card text-white bg-primary mb-3">
                <div class="card-body text-center">
                    <h5 class="card-title">Total Fund</h5>
                    <h2 class="card-text" th:text="${#numbers.formatCurrency(totalFund)}">$10,000,000</h2>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card text-white bg-success mb-3">
                <div class="card-body text-center">
                    <h5 class="card-title">Available to Invest</h5>
                    <h2 class="card-text" th:text="${#numbers.formatCurrency(availableFund)}">$0</h2>
                </div>
            </div>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">Add to Fund</h5>
            <form action="/fund/add" method="post" class="row g-3">
                <div class="col-auto">
                    <input type="number" step="0.01" name="amount" class="form-control" placeholder="Amount" required>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">Add Money</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">New Investment</h5>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <form action="/investments" method="post" class="row g-3">
                <div class="col-md-5">
                    <input type="text" name="name" class="form-control" placeholder="Investment Name" required>
                </div>
                <div class="col-md-4">
                    <input type="number" step="0.01" name="amount" class="form-control" placeholder="Amount to Invest" required>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-success">Invest</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="card-title mb-0">Active Investments</h5>
                <form action="/" method="get" class="d-flex">
                    <select name="sort" class="form-select form-select-sm me-2" onchange="this.form.submit()">
                        <option value="date" th:selected="${param.sort == null or param.sort[0] == 'date'}">Latest First</option>
                        <option value="name" th:selected="${param.sort != null and param.sort[0] == 'name'}">Alphabetical</option>
                        <option value="amountAsc" th:selected="${param.sort != null and param.sort[0] == 'amountAsc'}">Amount Asc</option>
                        <option value="amountDesc" th:selected="${param.sort != null and param.sort[0] == 'amountDesc'}">Amount Desc</option>
                    </select>
                </form>
            </div>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-dark">
                    <tr>
                        <th>Name</th>
                        <th>Amount</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="inv : ${investments}">
                        <td th:text="${inv.name}">Name</td>
                        <td th:text="${#numbers.formatCurrency(inv.amount)}">$0</td>
                        <td th:text="${#temporals.format(inv.createdAt, 'dd-MM-yyyy HH:mm')}">Date</td>
                        <td>
                            <div class="btn-group">
                                <a th:href="@{/investments/{id}(id=${inv.id})}" class="btn btn-sm btn-outline-primary">Details</a>
                                <form th:action="@{/investments/{id}/delete(id=${inv.id})}" th:method="delete" style="display: inline;" onsubmit="return confirm('Are you sure?')">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
